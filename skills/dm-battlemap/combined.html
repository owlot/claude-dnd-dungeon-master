  /* ---------- legend panel ---------- */
  function wardName(w) { for (var i = 0; i < WARDS.length; i++) if (WARDS[i][0] === w) return WARDS[i][1]; return w; }

  // Tapping a line of the printed ward lists on the poster finds that building on the map.
  var KEYS = [["sea", [75, 375, 1890, 1170]], ["castle", [75, 1530, 1890, 2760]], ["dock", [75, 3195, 1890, 4185]], ["north", [4104, 375, 5925, 1515]],
    ["trades", [4104, 1611, 5925, 2400]], ["dead", [4104, 2535, 5925, 2925]], ["south", [4104, 3090, 5925, 4005]], ["harbor", [2310, 4764, 3720, 5130]]];
  var prevView = null;
  function legTap(sx, sy) {
    var u = unitPoint(sx, sy), box = null;

  window.addEventListener("resize", render);

  /* ---------- start ---------- */
  var up = window.claude && claude.use ? Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]) : Promise.resolve([null, null, null]);

      PLACES = (d.known || []).map(function (x) { return { slug: x.slug, name: x.name, desc: x.desc || "", img: x.img || "", known: true }; }).concat((d.unknown || []).map(function (x) { return { slug: x.slug, name: x.name, desc: "", img: "", known: false }; }));

  }

  }).then(function (dm) { isDM = !!dm; if (!isDM) st = { img: null, fogOn: false, revealed: {}, pins: [], routes: [], rev: 0 }; start(); render(); }, function () { render(); });
})();
  })(dCity);

  var first = "battle";
  try { first = (location.hash || "").replace("#", "") || localStorage.getItem("tm_tab") || "battle"; } catch (e) {}
  if (first !== "city") first = "battle";
  if (first === "city") show("city"); else active = "battle";
